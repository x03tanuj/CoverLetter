services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/coverletter
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      CLIENT_URL: http://localhost:5471
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "5471:3000"
    depends_on:
      server:
        condition: service_started

volumes:
  mongo_data:
